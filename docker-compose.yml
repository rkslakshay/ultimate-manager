# Optional: run PostgreSQL in Docker instead of the embedded dev database.
# Set DB_MODE=external in .env, then: docker compose up -d
services:
  postgres:
    image: postgres:18-alpine
    container_name: um-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: um
      POSTGRES_PASSWORD: um
      POSTGRES_DB: ultimate_manager
    ports:
      - '5433:5432'
    volumes:
      - um-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U um -d ultimate_manager']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  um-pgdata:
